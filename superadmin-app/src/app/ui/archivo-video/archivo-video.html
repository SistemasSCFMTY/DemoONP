<figure class="m-0">
  <div class="overflow-hidden rounded-card border border-border bg-bg">
    @if (estado()?.url; as url) {
      <!-- `preload="metadata"` and not `auto`: the header, the duration, and
           nothing else until an analyst presses play. `playsinline` keeps iOS
           from taking the video fullscreen on tap. `w-full max-w-full` is what
           stops an intrinsic video width from pushing the page sideways. -->
      <video
        [src]="url"
        [attr.aria-label]="pie()"
        controls
        preload="metadata"
        playsinline
        class="block h-auto w-full max-w-full"
      ></video>
    } @else if (estado()?.error; as mensaje) {
      <div class="flex flex-col items-center gap-2 px-4 py-8 text-center">
        <svg lucideVideoOff class="size-6 text-text-soft" aria-hidden="true"></svg>
        <p class="text-status text-text-soft">{{ mensaje }}</p>
      </div>
    } @else {
      <div class="flex flex-col items-center gap-2 px-4 py-8" aria-live="polite">
        <svg
          lucideLoaderCircle
          class="size-5 animate-spin text-text-soft"
          aria-hidden="true"
        ></svg>
        <p class="text-status text-text-soft">Cargando la videograbación…</p>
      </div>
    }
  </div>
  <figcaption class="mt-1.5 text-center text-status text-text-soft">
    {{ pie() }}
  </figcaption>
</figure>
