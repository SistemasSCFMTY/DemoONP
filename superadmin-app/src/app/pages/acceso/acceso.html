<!--
  Copy is verbatim from `screen-admin-login`
  (onp_fer_etapa2_pf.html:1895–1913), minus the "Volver a la solicitud"
  button: the panel is a separate deployment now, and there is no prospect
  flow behind this page to go back to.

  Centred card rather than the 390px column — desktop surface (§12).
-->
<div class="flex min-h-full items-center justify-center px-6 py-16">
  <div class="w-full max-w-sm">
    <div class="mb-8 text-center">
      <p class="font-heading text-2xl font-bold text-navy-deep">ONP FER</p>
      <div class="mx-auto mt-3 h-px w-10 bg-gold"></div>
    </div>

    <div class="rounded-card bg-surface p-7 shadow-ring">
      <h1 #titulo tabindex="-1" class="font-heading text-xl font-bold outline-none">
        Acceso administrativo
      </h1>
      <p class="mt-1 text-sm leading-relaxed text-text-soft">
        Área restringida al personal autorizado de la SOFOM.
      </p>

      <form [formGroup]="formulario" (ngSubmit)="entrar()" class="mt-6">
        <div class="mb-4">
          <label for="acceso-correo" class="mb-1.5 block text-label font-semibold">Correo</label>
          <input
            id="acceso-correo"
            type="email"
            formControlName="correo"
            autocomplete="username"
            placeholder="analista@tusofom.mx"
            aria-required="true"
            class="w-full rounded-control border border-border bg-surface px-3 py-2 text-sm text-text placeholder:text-text-soft/60 focus:border-navy"
          />
        </div>

        <div class="mb-2">
          <label for="acceso-password" class="mb-1.5 block text-label font-semibold">
            Contraseña
          </label>
          <input
            id="acceso-password"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            placeholder="••••••••"
            aria-required="true"
            [attr.aria-describedby]="error() ? 'acceso-error' : null"
            class="w-full rounded-control border border-border bg-surface px-3 py-2 text-sm text-text placeholder:text-text-soft/60 focus:border-navy"
          />
        </div>

        @if (error(); as mensaje) {
          <p
            id="acceso-error"
            role="alert"
            class="mt-2 flex items-start gap-1.5 text-status font-medium text-error"
          >
            <svg lucideCircleAlert class="mt-px size-4 shrink-0" aria-hidden="true"></svg>
            {{ mensaje }}
          </p>
        }

        <p class="mt-4 text-status text-text-soft">
          Usa el correo y la contraseña de tu cuenta del panel.
        </p>

        <button
          type="submit"
          [disabled]="cargando()"
          class="mt-4 w-full rounded-control bg-navy px-4 py-2.5 text-sm font-semibold text-surface transition-colors hover:bg-navy-deep disabled:cursor-not-allowed disabled:opacity-60"
        >
          {{ textoBoton() }}
        </button>
      </form>
    </div>

    @if (modoSimulado) {
      <p class="mt-5 text-center text-status text-warning">
        Modo demostración: el panel responde desde datos de ejemplo, sin servidor.
      </p>
    }
  </div>
</div>
